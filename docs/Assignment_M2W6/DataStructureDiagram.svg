<svg viewBox="0 0 1700 1500" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS', 'Marker Felt', 'Kalam', cursive, sans-serif">
  <defs>
    <pattern id="paper" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#fffdf5"/>
      <line x1="0" y1="39" x2="40" y2="39" stroke="#e8e4d0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1700" height="1500" fill="url(#paper)"/>
  <rect x="0" y="0" width="1700" height="1500" fill="none" stroke="#d8d2b8" stroke-width="6"/>

  <!-- Title -->
  <text x="850" y="42" text-anchor="middle" font-size="32" font-weight="bold" fill="#2c2c2c">B2 — โครงสร้างข้อมูล Firestore ของ smartFit_daily (ฉบับเต็ม)</text>
  <text x="850" y="70" text-anchor="middle" font-size="17" fill="#555">อ้างอิงจาก database-schema.md §8.2 + โค้ดจริงใน smartfit_daily_app/apps/web/server/ — 2 top-level collection + 5 subcollection</text>

  <!-- ============ users ============ -->
  <g>
    <rect x="40" y="100" width="480" height="600" rx="14" fill="#fff8e1" stroke="#c9a227" stroke-width="3"/>
    <text x="60" y="138" font-size="26" font-weight="bold" fill="#1a1a1a">📁 users</text>
    <text x="60" y="160" font-size="13" fill="#777">(top-level collection · document ID = Firebase Auth UID)</text>
    <line x1="60" y1="172" x2="500" y2="172" stroke="#c9a227" stroke-width="2"/>

    <text x="70" y="198" font-size="16" fill="#2c2c2c">displayName · age · sex</text>
    <text x="70" y="222" font-size="16" fill="#2c2c2c">weightKg · heightCm · activityLevel · tdeeKcal</text>
    <text x="70" y="246" font-size="16" fill="#2c2c2c">equipmentTypes[]</text>

    <text x="70" y="278" font-size="16" font-weight="bold" fill="#2c2c2c">goalSelection {</text>
    <text x="85" y="300" font-size="15" fill="#2c2c2c">goalType · targetWeightKg</text>
    <text x="85" y="322" font-size="15" fill="#2c2c2c">dailyCalorieTargetKcal · isSafetyFloorApplied }</text>

    <text x="70" y="354" font-size="16" font-weight="bold" fill="#2c2c2c">streakSnapshot { currentStreakDays · computedAt }</text>

    <text x="70" y="386" font-size="16" font-weight="bold" fill="#2c2c2c">weightForecastSnapshot {</text>
    <text x="85" y="408" font-size="15" fill="#2c2c2c">forecastedGoalDate · averageDailyDeficitKcal</text>
    <text x="85" y="430" font-size="15" fill="#2c2c2c">computedAt }</text>

    <text x="70" y="462" font-size="16" font-weight="bold" fill="#2c2c2c">todaysRecommendation {</text>
    <text x="85" y="484" font-size="15" fill="#2c2c2c">computedFor · rejectedVideoIds[]</text>
    <text x="85" y="506" font-size="15" fill="#2c2c2c">video { externalVideoId ·</text>
    <ellipse cx="248" cy="521" rx="34" ry="15" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <text x="248" y="526" font-size="15" fill="#c0392b" font-weight="bold" text-anchor="middle">title</text>
    <text x="285" y="528" font-size="15" fill="#2c2c2c">·</text>
    <text x="85" y="550" font-size="15" fill="#2c2c2c">durationMinutes · activityType · intensity ·</text>
    <text x="85" y="572" font-size="15" fill="#2c2c2c">estimatedKcal · includesWarmupCooldown } }</text>
    <text x="85" y="592" font-size="13" fill="#c0392b" font-weight="bold">↑ วงกลม = จดซ้ำเพราะไม่มี JOIN (ดูคำอธิบายขวา)</text>

    <text x="70" y="622" font-size="16" font-weight="bold" fill="#2c2c2c">integrationConnections {</text>
    <text x="85" y="644" font-size="15" fill="#2c2c2c">smartScale { connectionStatus · connectedAt }</text>
    <text x="85" y="666" font-size="15" fill="#2c2c2c">wearable { connectionStatus · connectedAt } }</text>
  </g>

  <!-- ============ pairingCodes ============ -->
  <g>
    <rect x="550" y="100" width="590" height="600" rx="14" fill="#e8f4fb" stroke="#2e78a6" stroke-width="3"/>
    <text x="570" y="138" font-size="26" font-weight="bold" fill="#1a1a1a">📁 pairingCodes</text>
    <text x="570" y="160" font-size="13" fill="#777">(top-level collection · document ID = รหัส 6 หลักเอง)</text>
    <line x1="570" y1="172" x2="1120" y2="172" stroke="#2e78a6" stroke-width="2"/>

    <text x="580" y="200" font-size="17" fill="#2c2c2c">uid · createdAt · expiresAt</text>
    <text x="580" y="228" font-size="14" fill="#3a6b8a">(ไม่มี field เทียบเท่า is_used — single-use enforce</text>
    <text x="580" y="248" font-size="14" fill="#3a6b8a">ด้วยการลบ document ทิ้งทันทีตอน redeem สำเร็จ)</text>

    <line x1="580" y1="270" x2="1110" y2="270" stroke="#2e78a6" stroke-width="1" stroke-dasharray="4,3"/>

    <text x="580" y="298" font-size="16" font-weight="bold" fill="#1a4a63">วงจรชีวิตของ 1 pairing code</text>
    <text x="580" y="326" font-size="14" fill="#2c2c2c">1. เว็บ (login แล้ว) เรียก POST /api/pairing/create-code</text>
    <text x="580" y="350" font-size="14" fill="#2c2c2c">2. สร้าง document pairingCodes/{code} — code สุ่ม 6 หลัก,</text>
    <text x="598" y="372" font-size="14" fill="#2c2c2c">expiresAt = สร้างเสร็จ + 5 นาที</text>
    <text x="580" y="398" font-size="14" fill="#2c2c2c">3. ผู้ใช้กรอกรหัสในแอปมือถือ → POST /api/pairing/redeem</text>
    <text x="598" y="420" font-size="14" fill="#2c2c2c">(ไม่ต้อง login มาก่อน — ข้อยกเว้นเดียวที่ไม่ผ่าน</text>
    <text x="598" y="442" font-size="14" fill="#2c2c2c">authenticate middleware)</text>
    <text x="580" y="468" font-size="14" fill="#2c2c2c">4. เจอ + ยังไม่หมดอายุ → ลบ document ทันที + ออก</text>
    <text x="598" y="490" font-size="14" fill="#2c2c2c">custom token ให้มือถือ sign in แทนการพิมพ์รหัสผ่าน</text>
    <text x="580" y="516" font-size="14" fill="#2c2c2c">5. ไม่เจอ / หมดอายุ / ถูกใช้ไปแล้ว (ถูกลบไปแล้ว) →</text>
    <text x="598" y="538" font-size="14" fill="#2c2c2c">คืน 410 Gone เดียวกันหมด แยกไม่ออกว่ากรณีไหน</text>

    <text x="580" y="576" font-size="14" fill="#3a6b8a" font-weight="bold">ทำไมไม่มีชื่อผู้ใช้ซ้ำที่นี่?</text>
    <text x="580" y="598" font-size="14" fill="#2c2c2c">ไม่มี UI ไหนต้องแสดงชื่อจาก document นี้เลย —</text>
    <text x="580" y="620" font-size="14" fill="#2c2c2c">มีแค่ uid ใช้ mint custom token เท่านั้น ไม่ต้องจดซ้ำ</text>
  </g>

  <!-- ============ Legend ============ -->
  <g>
    <rect x="1170" y="100" width="490" height="600" rx="14" fill="#fdf2ef" stroke="#c0392b" stroke-width="2.5"/>
    <text x="1190" y="138" font-size="21" font-weight="bold" fill="#c0392b">คำอธิบาย — "จดซ้ำเพราะไม่มี JOIN"</text>
    <line x1="1190" y1="150" x2="1640" y2="150" stroke="#c0392b" stroke-width="1.5"/>

    <text x="1190" y="176" font-size="14" fill="#2c2c2c">Firestore เป็น NoSQL — ไม่มี JOIN ข้าม collection</text>
    <text x="1190" y="198" font-size="14" fill="#2c2c2c">แบบ relational DB เมื่อต้องอ้างถึงข้อมูลจากที่อื่น</text>
    <text x="1190" y="220" font-size="14" fill="#2c2c2c">(เช่นวิดีโอจริงบน YouTube) จึงเก็บทั้ง 2 อย่าง:</text>
    <text x="1205" y="248" font-size="14" fill="#2c2c2c">• externalVideoId — ตัวอ้างอิง (id)</text>
    <text x="1205" y="270" font-size="14" fill="#2c2c2c">• title / activityType / intensity /</text>
    <text x="1220" y="292" font-size="14" fill="#2c2c2c">estimatedKcal — ค่าที่ "จดซ้ำ" ไว้</text>
    <text x="1220" y="314" font-size="14" fill="#2c2c2c">ตอนคำนวณ ไม่ต้องเรียก YouTube/</text>
    <text x="1220" y="336" font-size="14" fill="#2c2c2c">AI ใหม่ทุกครั้งที่แสดงผล</text>

    <text x="1190" y="366" font-size="15" font-weight="bold" fill="#c0392b">พบ 2 จุดในระบบนี้:</text>
    <text x="1205" y="390" font-size="14" fill="#2c2c2c">1) users.todaysRecommendation.video</text>
    <text x="1220" y="410" font-size="13" fill="#8a4a42">(แคชผลแนะนำวิดีโอรายวัน — เปลี่ยนทุกวัน)</text>
    <text x="1205" y="434" font-size="14" fill="#2c2c2c">2) workoutSessions.sessionVideos[]</text>
    <text x="1220" y="454" font-size="13" fill="#8a4a42">(แคชถาวรของ session ที่กดเริ่มจริงแล้ว)</text>

    <line x1="1190" y1="478" x2="1640" y2="478" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>

    <text x="1190" y="504" font-size="16" font-weight="bold" fill="#1a1a1a">สรุป collection ทั้งหมดในระบบ (7)</text>
    <text x="1205" y="528" font-size="14" fill="#2c2c2c">Top-level: users · pairingCodes</text>
    <text x="1205" y="552" font-size="14" fill="#2c2c2c">ใต้ users/{userId}: workoutSessions ·</text>
    <text x="1220" y="574" font-size="14" fill="#2c2c2c">dailyLogs · dayStatus · weeklyPlanEntries ·</text>
    <text x="1220" y="596" font-size="14" fill="#2c2c2c">weightRecords</text>
    <text x="1190" y="624" font-size="13" fill="#777">(ไม่มี user_account แยก — Firebase Authentication</text>
    <text x="1190" y="644" font-size="13" fill="#777">เก็บ credential/session ให้เองทั้งหมด ตาม §8.2)</text>
  </g>

  <!-- Section label -->
  <text x="40" y="735" font-size="20" font-weight="bold" fill="#444">ใต้ users/{userId}/ … (subcollection ทั้งหมด 5 อัน)</text>

  <!-- ============ workoutSessions ============ -->
  <g>
    <rect x="40" y="750" width="480" height="600" rx="14" fill="#f4ecfb" stroke="#7d4fa3" stroke-width="3"/>
    <text x="60" y="788" font-size="24" font-weight="bold" fill="#1a1a1a">📁 workoutSessions</text>
    <text x="60" y="810" font-size="13" fill="#777">(document ID = auto-generated session id)</text>
    <line x1="60" y1="822" x2="500" y2="822" stroke="#7d4fa3" stroke-width="2"/>

    <text x="70" y="848" font-size="16" fill="#2c2c2c">status · startedAt · actualDurationMinutes</text>
    <text x="70" y="878" font-size="16" font-weight="bold" fill="#2c2c2c">actualCalorieBurn { source · calculatedKcal }</text>
    <text x="70" y="908" font-size="16" font-weight="bold" fill="#2c2c2c">wearableReading {</text>
    <text x="85" y="930" font-size="15" fill="#2c2c2c">platform · calorieValueKcal · recordedAt }</text>

    <text x="70" y="964" font-size="16" font-weight="bold" fill="#2c2c2c">sessionVideos[] {</text>
    <text x="85" y="986" font-size="15" fill="#2c2c2c">externalVideoId ·</text>
    <ellipse cx="300" cy="981" rx="30" ry="14" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <text x="300" y="986" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">title</text>
    <text x="85" y="1010" font-size="15" fill="#2c2c2c">durationMinutes ·</text>
    <ellipse cx="298" cy="1005" rx="48" ry="14" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <text x="298" y="1010" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">activityType</text>
    <text x="85" y="1034" font-size="15" fill="#2c2c2c">estimatedKcal ·</text>
    <ellipse cx="284" cy="1029" rx="36" ry="14" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <text x="284" y="1034" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">intensity</text>
    <text x="85" y="1058" font-size="15" fill="#2c2c2c">includesWarmupCooldown }</text>
    <text x="85" y="1078" font-size="13" fill="#c0392b" font-weight="bold">↑ วงกลม = จดซ้ำเพราะไม่มี JOIN (เช่นเดียวกับ users)</text>
    <text x="70" y="1098" font-size="12" fill="#7d4fa3">(sessionVideos ยัง TODO ในโค้ดจริง 2026-08-31 — ออกแบบไว้แล้วใน database-schema.md §3.6)</text>

    <text x="70" y="1124" font-size="15" fill="#2c2c2c">rejectedVideoIds[] { externalVideoId · rejectedAt }</text>

    <!-- Subfolder: sessionVideos as nested folder -->
    <rect x="60" y="1144" width="440" height="180" rx="12" fill="#ffffff" stroke="#7d4fa3" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="75" y="1174" font-size="20" font-weight="bold" fill="#1a1a1a">└ 📁 sessionVideos</text>
    <text x="90" y="1195" font-size="12" fill="#777">(จริงๆ เป็น embedded array field ในเอกสาร</text>
    <text x="90" y="1212" font-size="12" fill="#777">เดียวกันด้านบน ไม่ใช่ subcollection แยก —</text>
    <text x="90" y="1229" font-size="12" fill="#777">bounded แค่ 1-3 รายการ/session ตาม §8.2)</text>
    <text x="90" y="1258" font-size="14" fill="#2c2c2c">1 session = 1-3 รายการ (วิดีโอหลัก +</text>
    <text x="90" y="1280" font-size="14" fill="#2c2c2c">warmup/cooldown ถ้าความเข้มข้นสูง)</text>
    <text x="90" y="1302" font-size="14" fill="#2c2c2c">field ซ้ำกับ video ด้านบนทุกตัว</text>
  </g>

  <!-- ============ dailyLogs ============ -->
  <g>
    <rect x="550" y="750" width="280" height="160" rx="12" fill="#eafaf1" stroke="#2f9e6e" stroke-width="2.5"/>
    <text x="565" y="780" font-size="20" font-weight="bold" fill="#1a1a1a">📁 dailyLogs</text>
    <text x="565" y="800" font-size="12" fill="#777">(document ID = วันที่ ISO เช่น 2026-08-31)</text>
    <line x1="565" y1="810" x2="815" y2="810" stroke="#2f9e6e" stroke-width="1.5"/>
    <text x="570" y="834" font-size="14" fill="#2c2c2c">minutesExercised</text>
    <text x="570" y="856" font-size="14" fill="#2c2c2c">accumulatedKcal</text>
    <text x="570" y="878" font-size="14" fill="#2c2c2c">completionStatus · source</text>
    <text x="570" y="900" font-size="11" fill="#3d8a63">('workout_session' / 'cheat_rest_override')</text>
  </g>

  <!-- ============ dayStatus ============ -->
  <g>
    <rect x="860" y="750" width="280" height="140" rx="12" fill="#eaf6fa" stroke="#2e8ca6" stroke-width="2.5"/>
    <text x="875" y="780" font-size="20" font-weight="bold" fill="#1a1a1a">📁 dayStatus</text>
    <text x="875" y="800" font-size="12" fill="#777">(document ID = วันที่ ISO)</text>
    <line x1="875" y1="810" x2="1125" y2="810" stroke="#2e8ca6" stroke-width="1.5"/>
    <text x="880" y="834" font-size="14" fill="#2c2c2c">isCheatRest · setAt</text>
    <text x="880" y="862" font-size="12" fill="#3a7a8a">(PLN-2 — เฉพาะวันนี้เท่านั้นที่ตั้งได้)</text>
  </g>

  <!-- ============ weeklyPlanEntries ============ -->
  <g>
    <rect x="550" y="930" width="280" height="160" rx="12" fill="#fef7e6" stroke="#c98a1a" stroke-width="2.5"/>
    <text x="565" y="960" font-size="19" font-weight="bold" fill="#1a1a1a">📁 weeklyPlanEntries</text>
    <text x="565" y="980" font-size="12" fill="#777">(document ID = วันที่ ISO)</text>
    <line x1="565" y1="990" x2="815" y2="990" stroke="#c98a1a" stroke-width="1.5"/>
    <text x="570" y="1014" font-size="14" fill="#2c2c2c">plannedActivityType</text>
    <text x="570" y="1036" font-size="14" fill="#2c2c2c">isDefaultAuto</text>
    <text x="570" y="1064" font-size="11" fill="#8a6a1a">(PLN-1 — วันในอดีตที่มี dailyLogs</text>
    <text x="570" y="1080" font-size="11" fill="#8a6a1a">แล้วห้ามแก้ ตรวจแบบ derived ไม่ persist)</text>
  </g>

  <!-- ============ weightRecords ============ -->
  <g>
    <rect x="860" y="910" width="280" height="180" rx="12" fill="#f7ebf7" stroke="#9a4fa3" stroke-width="2.5"/>
    <text x="875" y="940" font-size="19" font-weight="bold" fill="#1a1a1a">📁 weightRecords</text>
    <text x="875" y="960" font-size="12" fill="#777">(document ID = auto-generated)</text>
    <line x1="875" y1="970" x2="1125" y2="970" stroke="#9a4fa3" stroke-width="1.5"/>
    <text x="880" y="994" font-size="14" fill="#2c2c2c">weightKg · source</text>
    <text x="880" y="1016" font-size="14" fill="#2c2c2c">bodyCompositionNote (optional)</text>
    <text x="880" y="1038" font-size="14" fill="#2c2c2c">recordedAt</text>
    <text x="880" y="1064" font-size="11" fill="#7a3a83">(source: 'bluetooth_sync' หรือ 'manual_entry')</text>
  </g>

  <!-- Footer notes -->
  <text x="40" y="1380" font-size="14" fill="#999">อ้างอิงจาก docs/02-design/02-technical/database-schema.md §8.2 (Table → Firestore Collection/Document Mapping)</text>
  <text x="40" y="1402" font-size="14" fill="#999">และโค้ดจริงใน smartfit_daily_app/apps/web/server/routes/{content-recommendation,exertion-calorie,integration-gateway,personalization-profile,planner-day-status,logging-streak}/</text>
  <text x="40" y="1424" font-size="14" fill="#999">หมายเหตุ: users/pairingCodes เป็น top-level collection จริงตาม Firestore console ที่เห็นในหน้าจอ; ที่เหลือทั้ง 5 เป็น subcollection ของ users/{userId}</text>
  <text x="40" y="1446" font-size="14" fill="#999">user_account (credential/session) ไม่มี Firestore document แยก — Firebase Authentication จัดการเองทั้งหมดตาม database-schema.md §8.2 แถวแรก</text>
</svg>
