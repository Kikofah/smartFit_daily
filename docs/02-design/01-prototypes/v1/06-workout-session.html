<!-- Feature: REC-2, REC-4 | REQ: REQ-05, REQ-07 -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กำลังออกกำลังกาย - smartFit daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --color-paper: #F6F2EA;
  --color-paper-alt: #EFE9DC;
  --color-paper-sunken: #E7DFCF;
  --color-ink: #33302A;
  --color-ink-muted: #6B6459;
  --color-ink-faint: #9C9484;
  --color-border: #DAD2C1;
  --color-border-strong: #C4B9A2;
  --color-clay: #B4694C;
  --color-clay-strong: #9C5940;
  --color-sage: #7E8F6C;
  --color-sage-strong: #687858;
  --color-sand: #C9A26B;
  --color-success: var(--color-sage);
  --color-warning: #BE9A4D;
  --color-danger: #A85A45;
  --color-info: #7A8B86;
  --font-family-base: "IBM Plex Sans Thai", "IBM Plex Sans", -apple-system, "Noto Sans Thai", "Segoe UI", sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;
  --border-width: 1px;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --shadow-float: 0 2px 8px rgba(51,48,42,0.06);
}
html, body { margin:0; padding:0; background:#DCD5C8; font-family:var(--font-family-base); color:var(--color-ink); }
.device-frame { max-width:420px; min-height:100vh; margin:0 auto; background:var(--color-paper); position:relative; padding-bottom: 88px; }
.screen-content { padding: var(--space-8); }
.text-display { font-size:28px; line-height:36px; font-weight:600; margin:0; }
.text-h1 { font-size:22px; line-height:30px; font-weight:600; margin:0; }
.text-h2 { font-size:18px; line-height:26px; font-weight:500; margin:0; }
.text-h3 { font-size:16px; line-height:22px; font-weight:500; margin:0; }
.text-body { font-size:15px; line-height:22px; font-weight:400; margin:0; }
.text-body-sm { font-size:13px; line-height:18px; font-weight:400; margin:0; color: var(--color-ink-muted); }
.text-caption { font-size:12px; line-height:16px; font-weight:500; margin:0; color: var(--color-ink-muted); }
.btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 var(--space-4); border-radius:var(--radius-md); font-size:15px; font-weight:500; cursor:pointer; border:none; font-family:inherit; text-decoration:none; box-sizing:border-box; }
.btn-primary { background:var(--color-clay); color:var(--color-paper); width:100%; }
.btn-primary:active { background:var(--color-clay-strong); }
.btn-secondary { background:var(--color-paper-alt); color:var(--color-ink); border:var(--border-width) solid var(--color-border-strong); }
.btn-ghost { background:transparent; color:var(--color-ink-muted); border:none; }
.btn-ghost:hover { text-decoration:underline; }
.card { background:var(--color-paper-alt); border-radius:var(--radius-lg); overflow:hidden; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; max-width:420px; margin:0 auto; display:flex; background:var(--color-paper); border-top:var(--border-width) solid var(--color-border); padding: var(--space-2) 0; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:var(--space-1); min-height:44px; justify-content:center; text-decoration:none; color:var(--color-ink-muted); font-size:12px; }
.nav-item.active { color:var(--color-clay); }
</style>
<style>
  /* Immersive session screen: no bottom tab nav, Ghost "ปิด" replaces it for exiting */
  .device-frame { padding-bottom: var(--space-8); }
  .close-bar { display:flex; align-items:center; margin-bottom: var(--space-4); }
  .close-bar .btn-ghost { padding-left:0; min-width:44px; }

  .player-area { aspect-ratio: 16/9; background: var(--color-ink); border-radius: var(--radius-lg); display:flex; align-items:center; justify-content:center; color: var(--color-paper-alt); margin-bottom: var(--space-6); }
  .player-area svg { opacity:0.6; }

  /* Session stage indicator: วอร์มอัพ -> หลัก -> คูลดาวน์ for high-intensity sessions (REC-4) */
  .stage-track { display:flex; align-items:center; gap: var(--space-2); margin-bottom: var(--space-6); }
  .stage-step { flex:1; display:flex; flex-direction:column; align-items:center; gap: var(--space-2); }
  .stage-dot { width:12px; height:12px; border-radius:50%; background: var(--color-paper-sunken); border: 1px solid var(--color-border-strong); box-sizing:border-box; }
  .stage-step.done .stage-dot { background: var(--color-sage); border-color: var(--color-sage); }
  .stage-step.current .stage-dot { background: var(--color-clay); border-color: var(--color-clay); }
  .stage-step .stage-label { text-align:center; }
  .stage-step.current .stage-label { color: var(--color-ink); font-weight:500; }
  .stage-connector { flex:0 0 auto; width:100%; height:1px; background: var(--color-border); margin-top:-30px; }

  .time-display { text-align:center; margin-bottom: var(--space-8); }
  .time-display .elapsed { font-variant-numeric: tabular-nums; }

  .skip-warmup-wrap { text-align:center; margin-bottom: var(--space-4); min-height:44px; display:flex; align-items:center; justify-content:center; }

  .session-meta { text-align:center; margin-bottom: var(--space-8); }
</style>
</head>
<body>
<div class="device-frame">
  <div class="screen-content">

    <div class="close-bar">
      <!-- Ghost/Text "ปิด" button top-left stands in for exiting the immersive session, per DESIGN.md 3.1 -->
      <button type="button" class="btn btn-ghost" onclick="history.back()" aria-label="ปิด">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        &nbsp;ปิด
      </button>
    </div>

    <div class="session-meta">
      <p class="text-caption">HIIT เผาผลาญไว 20 นาที · ความเข้มข้นสูง</p>
    </div>

    <div class="player-area">
      <!-- Placeholder video player: a colored box standing in for the real video, no video backend yet -->
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"></path>
      </svg>
    </div>

    <!--
      REC-4: example video has intensity = "สูง" (high), so 3 stages are shown: วอร์มอัพ (3 min) -> หลัก -> คูลดาวน์ (3 min).
      Medium/low intensity sessions skip this stage sequencing entirely and render as a single-segment player
      (no warmup/cooldown insertion) — not shown on this example screen.
    -->
    <div class="stage-track" id="stageTrack">
      <div class="stage-step current" data-stage="warmup">
        <div class="stage-dot"></div>
        <span class="text-caption stage-label">วอร์มอัพ<br>3 นาที</span>
      </div>
      <div class="stage-step" data-stage="main">
        <div class="stage-dot"></div>
        <span class="text-caption stage-label">หลัก<br>20 นาที</span>
      </div>
      <div class="stage-step" data-stage="cooldown">
        <div class="stage-dot"></div>
        <span class="text-caption stage-label">คูลดาวน์<br>3 นาที</span>
      </div>
    </div>

    <div class="time-display">
      <p class="text-display elapsed" id="elapsedTime">00:01:18</p>
      <p class="text-body-sm">เวลาที่ทำไปแล้ว · ช่วงปัจจุบัน: วอร์มอัพ</p>
    </div>

    <!-- Low-emphasis Ghost/Text skip control, shown only during the warmup stage, per DESIGN.md skip-control rule -->
    <div class="skip-warmup-wrap" id="skipWarmupWrap">
      <button type="button" class="btn btn-ghost" onclick="skipWarmup()">ข้ามวอร์มอัพ</button>
    </div>

    <button type="button" class="btn btn-primary" onclick="location.href='07-workout-result.html'">จบเซสชัน</button>

  </div>
</div>

<script>
  // Demonstrates: the "ข้ามวอร์มอัพ" Ghost/Text control is low-emphasis and only shown during
  // the warmup stage. Clicking it advances the stage indicator to "หลัก" and hides the skip
  // control, since skipping is only meaningful during warmup.
  function skipWarmup() {
    var warmupStep = document.querySelector('.stage-step[data-stage="warmup"]');
    var mainStep = document.querySelector('.stage-step[data-stage="main"]');
    warmupStep.classList.remove('current');
    warmupStep.classList.add('done');
    mainStep.classList.add('current');
    document.getElementById('skipWarmupWrap').style.display = 'none';
    document.getElementById('elapsedTime').textContent = '00:03:00';
    document.querySelector('.time-display .text-body-sm').textContent = 'เวลาที่ทำไปแล้ว · ช่วงปัจจุบัน: หลัก';
  }
</script>
</body>
</html>
