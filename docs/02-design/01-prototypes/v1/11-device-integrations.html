<!-- Feature: INT-2, INT-3 | REQ: REQ-12, REQ-13 -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรไฟล์ - smartFit daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --color-paper: #F6F2EA;
  --color-paper-alt: #EFE9DC;
  --color-paper-sunken: #E7DFCF;
  --color-ink: #33302A;
  --color-ink-muted: #6B6459;
  --color-ink-faint: #9C9484;
  --color-border: #DAD2C1;
  --color-border-strong: #C4B9A2;
  --color-clay: #B4694C;
  --color-clay-strong: #9C5940;
  --color-sage: #7E8F6C;
  --color-sage-strong: #687858;
  --color-sand: #C9A26B;
  --color-success: var(--color-sage);
  --color-warning: #BE9A4D;
  --color-danger: #A85A45;
  --color-info: #7A8B86;
  --font-family-base: "IBM Plex Sans Thai", "IBM Plex Sans", -apple-system, "Noto Sans Thai", "Segoe UI", sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;
  --border-width: 1px;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --shadow-float: 0 2px 8px rgba(51,48,42,0.06);
}
html, body { margin:0; padding:0; background:#DCD5C8; font-family:var(--font-family-base); color:var(--color-ink); }
.device-frame { max-width:420px; min-height:100vh; margin:0 auto; background:var(--color-paper); position:relative; padding-bottom: 88px; }
.screen-content { padding: var(--space-8); }
.text-display { font-size:28px; line-height:36px; font-weight:600; margin:0; }
.text-h1 { font-size:22px; line-height:30px; font-weight:600; margin:0; }
.text-h2 { font-size:18px; line-height:26px; font-weight:500; margin:0; }
.text-h3 { font-size:16px; line-height:22px; font-weight:500; margin:0; }
.text-body { font-size:15px; line-height:22px; font-weight:400; margin:0; }
.text-body-sm { font-size:13px; line-height:18px; font-weight:400; margin:0; color: var(--color-ink-muted); }
.text-caption { font-size:12px; line-height:16px; font-weight:500; margin:0; color: var(--color-ink-muted); }
.btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 var(--space-4); border-radius:var(--radius-md); font-size:15px; font-weight:500; cursor:pointer; border:none; font-family:inherit; text-decoration:none; box-sizing:border-box; }
.btn-primary { background:var(--color-clay); color:var(--color-paper); width:100%; }
.btn-primary:active { background:var(--color-clay-strong); }
.btn-secondary { background:var(--color-paper-alt); color:var(--color-ink); border:var(--border-width) solid var(--color-border-strong); }
.btn-ghost { background:transparent; color:var(--color-ink-muted); border:none; }
.btn-ghost:hover { text-decoration:underline; }
.card { background:var(--color-paper-alt); border-radius:var(--radius-lg); overflow:hidden; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; max-width:420px; margin:0 auto; display:flex; background:var(--color-paper); border-top:var(--border-width) solid var(--color-border); padding: var(--space-2) 0; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:var(--space-1); min-height:44px; justify-content:center; text-decoration:none; color:var(--color-ink-muted); font-size:12px; }
.nav-item.active { color:var(--color-clay); }
</style>
<style>
  /* Page-specific styles, composed from the shared kit above */
  .profile-header { display:flex; align-items:center; gap: var(--space-4); margin-bottom: var(--space-8); }
  .avatar-placeholder { width:56px; height:56px; border-radius:50%; background: var(--color-paper-sunken); display:flex; align-items:center; justify-content:center; color: var(--color-ink-faint); flex-shrink:0; }

  .section-title { margin-bottom: var(--space-3); }
  .section-gap { margin-top: var(--space-8); }

  .device-row { display:flex; align-items:center; gap: var(--space-3); padding: var(--space-4); }
  .device-row + .device-row { border-top: var(--border-width) solid var(--color-border); }
  .device-icon { width:40px; height:40px; border-radius: var(--radius-md); background: var(--color-paper-sunken); display:flex; align-items:center; justify-content:center; color: var(--color-ink-muted); flex-shrink:0; }
  .device-info { flex:1; min-width:0; }
  .device-status { display:flex; align-items:center; gap: var(--space-1); margin-top:2px; }
  .status-dot { width:6px; height:6px; border-radius:50%; background: var(--color-ink-faint); }
  .status-dot.connected { background: var(--color-sage); }

  .link-row { display:flex; align-items:center; justify-content:space-between; padding: var(--space-4); min-height:44px; box-sizing:border-box; text-decoration:none; color:var(--color-ink); }
  .link-row + .link-row { border-top: var(--border-width) solid var(--color-border); }
  .link-row .chevron { color: var(--color-ink-faint); flex-shrink:0; }
</style>
</head>
<body>
<div class="device-frame">
  <div class="screen-content">

    <!-- Minimal profile header: no auth system exists yet, so no real name/avatar -->
    <div class="profile-header">
      <div class="avatar-placeholder">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path></svg>
      </div>
      <h1 class="text-h1">โปรไฟล์</h1>
    </div>

    <!-- INT-2/INT-3: Connected Devices section. Default example state = ยังไม่เชื่อมต่อ for both. -->
    <div>
      <h2 class="text-h2 section-title">อุปกรณ์ที่เชื่อมต่อ</h2>
      <div class="card">
        <div class="device-row">
          <div class="device-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="9" width="16" height="10" rx="2"></rect><path d="M8 9V7a4 4 0 0 1 8 0v2"></path></svg>
          </div>
          <div class="device-info">
            <p class="text-h3">ตาชั่งอัจฉริยะ</p>
            <div class="device-status">
              <span class="status-dot"></span>
              <span class="text-body-sm">ยังไม่เชื่อมต่อ</span>
            </div>
          </div>
          <button type="button" class="btn btn-secondary" onclick="location.href='12-device-pairing.html?device=scale'">เชื่อมต่อ</button>
        </div>
        <div class="device-row">
          <div class="device-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="4" width="10" height="16" rx="3"></rect><path d="M11 8h2"></path></svg>
          </div>
          <div class="device-info">
            <p class="text-h3">Wearable</p>
            <div class="device-status">
              <span class="status-dot"></span>
              <span class="text-body-sm">ยังไม่เชื่อมต่อ</span>
            </div>
          </div>
          <button type="button" class="btn btn-secondary" onclick="location.href='12-device-pairing.html?device=wearable'">เชื่อมต่อ</button>
        </div>
      </div>
      <p class="text-caption" style="margin-top: var(--space-3);">ไม่เชื่อมต่อก็ใช้แอปได้ปกติ — กรอกน้ำหนักเองได้เสมอ และแคลอรี่เผาผลาญยังคำนวณจากสูตร MET ได้</p>
    </div>

    <!-- Settings-style links back to onboarding screens, editable later per DESIGN.md 4.1 -->
    <div class="section-gap">
      <h2 class="text-h2 section-title">การตั้งค่า</h2>
      <div class="card">
        <a href="02-onboarding-equipment.html" class="link-row">
          <span class="text-body">แก้ไขอุปกรณ์ที่มี</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
        <a href="01-onboarding-personal-info.html" class="link-row">
          <span class="text-body">แก้ไขข้อมูลส่วนตัว</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </div>
    </div>

  </div>

  <!-- Bottom tab nav -->
  <nav class="bottom-nav">
    <a href="05-daily-dashboard.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 11l8-7 8 7"></path><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"></path></svg>
      <span>วันนี้</span>
    </a>
    <a href="08-weekly-planner.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 9h16"></path><path d="M8 3v4M16 3v4"></path></svg>
      <span>แผน</span>
    </a>
    <a href="10-progress-insights.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20V10M11 20V4M18 20v-7"></path></svg>
      <span>ความคืบหน้า</span>
    </a>
    <a href="11-device-integrations.html" class="nav-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path></svg>
      <span>โปรไฟล์</span>
    </a>
  </nav>
</div>
</body>
</html>
