<!-- Feature: INT-2, INT-3 | REQ: REQ-12, REQ-13 -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เชื่อมต่ออุปกรณ์ - smartFit daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --color-paper: #F6F2EA;
  --color-paper-alt: #EFE9DC;
  --color-paper-sunken: #E7DFCF;
  --color-ink: #33302A;
  --color-ink-muted: #6B6459;
  --color-ink-faint: #9C9484;
  --color-border: #DAD2C1;
  --color-border-strong: #C4B9A2;
  --color-clay: #B4694C;
  --color-clay-strong: #9C5940;
  --color-sage: #7E8F6C;
  --color-sage-strong: #687858;
  --color-sand: #C9A26B;
  --color-success: var(--color-sage);
  --color-warning: #BE9A4D;
  --color-danger: #A85A45;
  --color-info: #7A8B86;
  --font-family-base: "IBM Plex Sans Thai", "IBM Plex Sans", -apple-system, "Noto Sans Thai", "Segoe UI", sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;
  --border-width: 1px;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --shadow-float: 0 2px 8px rgba(51,48,42,0.06);
}
html, body { margin:0; padding:0; background:#DCD5C8; font-family:var(--font-family-base); color:var(--color-ink); }
.device-frame { max-width:420px; min-height:100vh; margin:0 auto; background:var(--color-paper); position:relative; padding-bottom: 88px; }
.screen-content { padding: var(--space-8); }
.text-display { font-size:28px; line-height:36px; font-weight:600; margin:0; }
.text-h1 { font-size:22px; line-height:30px; font-weight:600; margin:0; }
.text-h2 { font-size:18px; line-height:26px; font-weight:500; margin:0; }
.text-h3 { font-size:16px; line-height:22px; font-weight:500; margin:0; }
.text-body { font-size:15px; line-height:22px; font-weight:400; margin:0; }
.text-body-sm { font-size:13px; line-height:18px; font-weight:400; margin:0; color: var(--color-ink-muted); }
.text-caption { font-size:12px; line-height:16px; font-weight:500; margin:0; color: var(--color-ink-muted); }
.btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 var(--space-4); border-radius:var(--radius-md); font-size:15px; font-weight:500; cursor:pointer; border:none; font-family:inherit; text-decoration:none; box-sizing:border-box; }
.btn-primary { background:var(--color-clay); color:var(--color-paper); width:100%; }
.btn-primary:active { background:var(--color-clay-strong); }
.btn-secondary { background:var(--color-paper-alt); color:var(--color-ink); border:var(--border-width) solid var(--color-border-strong); }
.btn-ghost { background:transparent; color:var(--color-ink-muted); border:none; }
.btn-ghost:hover { text-decoration:underline; }
.card { background:var(--color-paper-alt); border-radius:var(--radius-lg); overflow:hidden; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; max-width:420px; margin:0 auto; display:flex; background:var(--color-paper); border-top:var(--border-width) solid var(--color-border); padding: var(--space-2) 0; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:var(--space-1); min-height:44px; justify-content:center; text-decoration:none; color:var(--color-ink-muted); font-size:12px; }
.nav-item.active { color:var(--color-clay); }
</style>
<style>
  /* Page-specific styles, composed from the shared kit above */
  .top-bar { margin-bottom: var(--space-8); }
  .back-btn { display:inline-flex; align-items:center; gap: var(--space-1); min-height:44px; padding:0 var(--space-1); }

  .demo-toggle { display:flex; gap: var(--space-2); margin-bottom: var(--space-8); background: var(--color-paper-sunken); border-radius: var(--radius-md); padding: var(--space-1); }
  .demo-toggle button { flex:1; min-height:40px; border:none; border-radius: var(--radius-sm); background:transparent; font-family:inherit; font-size:11px; font-weight:500; color: var(--color-ink-muted); cursor:pointer; padding: 0 var(--space-1); }
  .demo-toggle button.active { background: var(--color-paper); color: var(--color-ink); box-shadow: var(--shadow-float); }

  .status-panel { display:flex; flex-direction:column; align-items:center; text-align:center; gap: var(--space-4); padding: var(--space-16) 0 var(--space-8); }
  .status-icon-wrap { width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; background: var(--color-paper-sunken); }

  /* Connecting: simple static/fade dots, no bounce/spring per DESIGN.md 2.5 */
  .connecting-dots { display:flex; gap: 6px; }
  .connecting-dots span { width:8px; height:8px; border-radius:50%; background: var(--color-ink-faint); opacity:0.4; animation: pulse 1.2s ease-out infinite; }
  .connecting-dots span:nth-child(2) { animation-delay: 0.2s; }
  .connecting-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 100% { opacity:0.3; } 50% { opacity:0.9; } }
  @media (prefers-reduced-motion: reduce) {
    .connecting-dots span { animation: none; opacity: 0.7; }
  }

  .status-icon-wrap.success { background: rgba(126,143,108,0.16); color: var(--color-success); }
  .status-icon-wrap.warning { background: rgba(190,154,77,0.16); color: var(--color-warning); }

  /* Manual weigh-in fallback form (Forms & Inputs pattern, 3.7) */
  .form-group { margin-bottom: var(--space-4); }
  .form-label { display:block; margin-bottom: var(--space-2); }
  .stepper-input { display:flex; align-items:center; gap: var(--space-2); background: var(--color-paper-sunken); border-radius: var(--radius-md); padding: var(--space-2); }
  .stepper-btn { width:36px; height:36px; min-height:36px; border-radius: var(--radius-sm); background: var(--color-paper-alt); border: var(--border-width) solid var(--color-border-strong); font-size:18px; font-family:inherit; color: var(--color-ink); cursor:pointer; flex-shrink:0; }
  .stepper-value { flex:1; text-align:center; font-size:18px; font-weight:500; background:transparent; border:none; font-family:inherit; color: var(--color-ink); width:100%; box-sizing:border-box; }
  .stepper-value:focus { outline:none; }

  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="device-frame">
  <div class="screen-content">

    <div class="top-bar">
      <a href="11-device-integrations.html" class="btn btn-ghost back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 5l-7 7 7 7"></path></svg>
        ย้อนกลับ
      </a>
    </div>

    <!-- Demo state toggle (not part of real UI, for prototype review only) -->
    <div class="demo-toggle">
      <button type="button" class="active" id="btnConnecting" onclick="setState('connecting')">ตัวอย่าง: กำลังเชื่อมต่อ</button>
      <button type="button" id="btnSuccess" onclick="setState('success')">ตัวอย่าง: สำเร็จ</button>
      <button type="button" id="btnFailure" onclick="setState('failure')">ตัวอย่าง: เชื่อมต่อไม่สำเร็จ</button>
    </div>

    <!-- Connecting state: neutral copy, simple pulse dots (no bounce/spring) -->
    <div id="connectingState">
      <div class="status-panel">
        <div class="status-icon-wrap" id="deviceIconWrap">
          <svg id="deviceIconConnecting" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"></svg>
        </div>
        <h2 class="text-h3">กำลังเชื่อมต่อ<span id="deviceNameConnecting"></span>...</h2>
        <div class="connecting-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- Success state: --color-success (=sage), calm icon/color change, no confetti (DESIGN.md 2.1/2.5) -->
    <div id="successState" class="hidden">
      <div class="status-panel">
        <div class="status-icon-wrap success">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h2 class="text-h3" id="successTitle">เชื่อมต่อตาชั่งอัจฉริยะสำเร็จ</h2>
        <p class="text-body-sm" id="successBody">ข้อมูลจากอุปกรณ์นี้จะซิงค์เข้าโปรไฟล์ให้อัตโนมัติจากนี้ไป</p>
        <button type="button" class="btn btn-secondary" onclick="location.href='11-device-integrations.html'">กลับไปหน้าโปรไฟล์</button>
      </div>
    </div>

    <!-- Failure/fallback state: --color-warning framing (recoverable, not a form/danger error).
         Scale → manual weigh-in fallback form. Wearable → neutral retry action only (no manual data fallback).
         Open question (see 20260823-04-smart-integrations.md "จุดที่ยังไม่ได้ระบุ"): how to resolve multiple
         same-day weigh-ins (latest vs average) is unresolved — this form intentionally represents just a
         single weigh-in entry and does not address that question. -->
    <div id="failureState" class="hidden">
      <div class="status-panel" style="padding-bottom: var(--space-4);">
        <div class="status-icon-wrap warning">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4"></path><circle cx="12" cy="12" r="9"></circle><path d="M12 16.5v.01"></path></svg>
        </div>
        <h2 class="text-h3" id="failureTitle">เชื่อมต่อตาชั่งอัจฉริยะไม่สำเร็จ</h2>
        <p class="text-body-sm" id="failureBody">ลองใหม่อีกครั้ง หรือกรอกน้ำหนักเองตอนนี้ไปก่อนได้</p>
      </div>

      <!-- Scale fallback: manual weigh-in form -->
      <div id="scaleFallbackForm">
        <div class="form-group">
          <label class="form-label text-body-sm">น้ำหนัก (กก.)</label>
          <div class="stepper-input">
            <button type="button" class="stepper-btn" onclick="stepWeight(-0.1)">−</button>
            <input type="text" class="stepper-value" id="weightValue" value="68.4" inputmode="decimal">
            <button type="button" class="stepper-btn" onclick="stepWeight(0.1)">+</button>
          </div>
        </div>
        <button type="button" class="btn btn-primary" onclick="location.href='11-device-integrations.html'">บันทึกน้ำหนัก</button>
        <div style="margin-top: var(--space-3); text-align:center;">
          <button type="button" class="btn btn-ghost" onclick="setState('connecting')">ลองเชื่อมต่ออีกครั้ง</button>
        </div>
      </div>

      <!-- Wearable fallback: no manual data equivalent, neutral retry only -->
      <div id="wearableFallbackRetry" class="hidden">
        <button type="button" class="btn btn-primary" onclick="setState('connecting')">ลองใหม่อีกครั้ง</button>
        <p class="text-caption" style="margin-top: var(--space-3); text-align:center;">ระหว่างนี้แอปจะใช้ค่าประมาณแคลอรี่จากสูตร MET แทนไปก่อน</p>
      </div>
    </div>

  </div>
</div>

<script>
  var iconPaths = {
    scale: '<rect x="4" y="9" width="16" height="10" rx="2"></rect><path d="M8 9V7a4 4 0 0 1 8 0v2"></path>',
    wearable: '<rect x="7" y="4" width="10" height="16" rx="3"></rect><path d="M11 8h2"></path>'
  };
  var deviceLabels = { scale: 'ตาชั่งอัจฉริยะ', wearable: 'Wearable' };

  function getDevice() {
    var params = new URLSearchParams(window.location.search);
    var d = params.get('device');
    return (d === 'scale' || d === 'wearable') ? d : 'scale';
  }

  var device = getDevice();
  var label = deviceLabels[device];

  document.getElementById('deviceIconConnecting').innerHTML = iconPaths[device];
  document.getElementById('deviceNameConnecting').textContent = label;
  document.getElementById('successTitle').textContent = 'เชื่อมต่อ' + label + 'สำเร็จ';
  document.getElementById('successBody').textContent = device === 'scale'
    ? 'น้ำหนัก/องค์ประกอบร่างกายจากตาชั่งจะซิงค์เข้าโปรไฟล์ให้อัตโนมัติจากนี้ไป'
    : 'แคลอรี่ที่เผาผลาญจริงจาก Wearable จะถูกใช้แทนค่าประมาณจากสูตร MET เมื่อมีข้อมูล';
  document.getElementById('failureTitle').textContent = 'เชื่อมต่อ' + label + 'ไม่สำเร็จ';
  document.getElementById('failureBody').textContent = device === 'scale'
    ? 'ลองใหม่อีกครั้ง หรือกรอกน้ำหนักเองตอนนี้ไปก่อนได้'
    : 'ลองใหม่อีกครั้ง ระหว่างนี้ยังใช้ค่าประมาณแคลอรี่จากสูตร MET ได้ตามปกติ';

  if (device === 'wearable') {
    document.getElementById('scaleFallbackForm').classList.add('hidden');
    document.getElementById('wearableFallbackRetry').classList.remove('hidden');
  }

  function setState(state) {
    var ids = ['connectingState', 'successState', 'failureState'];
    ids.forEach(function (id) { document.getElementById(id).classList.add('hidden'); });
    var btns = ['btnConnecting', 'btnSuccess', 'btnFailure'];
    btns.forEach(function (id) { document.getElementById(id).classList.remove('active'); });

    if (state === 'success') {
      document.getElementById('successState').classList.remove('hidden');
      document.getElementById('btnSuccess').classList.add('active');
    } else if (state === 'failure') {
      document.getElementById('failureState').classList.remove('hidden');
      document.getElementById('btnFailure').classList.add('active');
    } else {
      document.getElementById('connectingState').classList.remove('hidden');
      document.getElementById('btnConnecting').classList.add('active');
    }
  }

  function stepWeight(delta) {
    var input = document.getElementById('weightValue');
    var val = parseFloat(input.value) || 0;
    val = Math.round((val + delta) * 10) / 10;
    input.value = val.toFixed(1);
  }
</script>
</body>
</html>
